[package]
name = "secp256k1-zkp"
version = "0.12.0"
authors = [ "Dawid Ciężarkiewicz <dpc@ucore.info>",
            "Andrew Poelstra <apoelstra@wpsoftware.net>",
            "Lucas Soriano <lucas@comit.network>",
            "Thomas Eizinger <thomas@comit.network>" ]
license = "CC0-1.0"
homepage = "https://github.com/ElementsProject/rust-secp256k1-zkp/"
repository = "https://github.com/ElementsProject/rust-secp256k1-zkp/"
description = "Rust bindings for the `libsecp256k1-zkp` library."
keywords = [ "crypto", "ECDSA", "secp256k1-zkp", "libsecp256k1-zkp", "elements" ]
readme = "README.md"
edition = "2021"

# Should make docs.rs show all functions, even those behind non-default features
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["std"]
std = ["secp256k1-zkp-sys/std", "secp256k1?/std", "alloc"]
alloc = []
rand-std = ["dep:rand", "rand?/std"]
recovery = ["secp256k1-zkp-sys/recovery", "secp256k1?/recovery"]
lowmemory = ["secp256k1-zkp-sys/lowmemory", "secp256k1?/lowmemory"]
global-context = ["std", "rand-std", "secp256k1?/global-context"]
global-context-less-secure = ["global-context"]
hashes = ["dep:hashes", "secp256k1?/hashes"]
serde = ["dep:serde", "secp256k1?/serde"]
rand = ["dep:rand", "secp256k1?/rand"]

[dependencies]
serde = { version = "1.0", default-features = false, optional = true }
rand = { version = "0.9", default-features = false, optional = true }
hashes = { package = "bitcoin_hashes", version = "0.14", default-features = false, optional = true }
secp256k1 = { version = "0.31.1", optional = true }
secp256k1-zkp-sys = { version = "0.11.0", default-features = false, path = "./secp256k1-zkp-sys" }
internals = { package = "bitcoin-private", version = "0.1.0" }

[dev-dependencies]
serde_test = "1.0"
hex_lit = "0.1"

[target.wasm32-unknown-unknown.dev-dependencies]
wasm-bindgen-test = "0.3"
getrandom = { version = "0.2", features = ["js"] }

[lib]
crate-type = ["cdylib", "rlib"]

[lints.rust]
unexpected_cfgs = { level = "deny", check-cfg = [ "cfg(rust_secp_fuzz)", "cfg(bench)", "cfg(secp256k1_fuzz)" ] }
